[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-transform-cli"
version = "0.3.0"
description = "CLI for YAML ↔ JSON ↔ CSV ↔ NDJSON transforms for pipelines and shell use"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "rmkr-dev" }]
keywords = ["cli", "yaml", "json", "csv", "ndjson", "transform", "pipeline"]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
data-transform = "data_transform.cli:main"

[project.urls]
Homepage = "https://github.com/rmkr-dev/data-transform-cli"
Repository = "https://github.com/rmkr-dev/data-transform-cli"
Issues = "https://github.com/rmkr-dev/data-transform-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
